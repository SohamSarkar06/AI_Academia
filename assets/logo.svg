<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="210"
  height="58"
  viewBox="0 0 800 220"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Background -->
  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Graduation Cap -->
  <polygon
    points="110,30 40,65 110,100 180,65"
    fill="#1E293B"
  />
  <rect x="95" y="100" width="30" height="15" fill="#1E293B"/>

  <!-- Tassel -->
  <line
    x1="180"
    y1="65"
    x2="180"
    y2="95"
    stroke="#38BDF8"
    stroke-width="4"
  />
  <circle cx="180" cy="98" r="5" fill="#7DD3FC"/>

  <!-- Brain Left (AI - Indigo) -->
  <path
    d="M70 140
       C50 140,45 110,65 100
       C50 80,75 60,95 75
       C100 55,135 65,130 90
       C155 95,155 130,130 135
       C130 160,95 170,85 150
       C75 165,55 155,60 140 Z"
    fill="#6366F1"
  />

  <!-- Brain Right (Academia - Cyan Teal) -->
  <path
    d="M110 140
       C130 140,135 110,115 100
       C130 80,105 60,85 75
       C80 55,45 65,50 90
       C25 95,25 130,50 135
       C50 160,85 170,95 150
       C105 165,125 155,120 140 Z"
    fill="#38BDF8"
  />

  <!-- Center Divider -->
  <rect x="103" y="90" width="4" height="80" fill="#0F172A"/>

  <!-- Text -->
  <text
    x="230"
    y="130"
    font-size="72"
    font-family="Segoe UI, Inter, Arial, sans-serif"
    font-weight="700"
  >
    <tspan fill="#6366F1">AI</tspan>
    <tspan fill="#7DD3FC">Academia</tspan>
  </text>
</svg>
