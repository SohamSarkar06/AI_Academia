<!DOCTYPE html>
<html>
<head>
  <title>Dashboard • AI Academia</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="dashboard-layout">

  <!-- LEFT : MAIN CONTENT -->
  <div class="main-panel">

    <header class="dash-header">
      <div class="logo">
    <img src="assets/logo.svg" alt="ICIVID">
  </div>
      <div id="userInfo"></div>
    </header>

    <div class="card">
      <h3>Upload PDF for Quick Revision</h3>

      <input type="file" id="pdfInput" accept="application/pdf">
      <button id="summarizeBtn">Summarize</button>

      <p class="hint">Only PDFs. Best for last-minute exam prep.</p>
    </div>

    <div class="card">
      <h3>📌 Key Revision Points</h3>
      <ul id="summaryOutput"></ul>
    </div>
    

  </div>

  <!-- RIGHT : HISTORY -->
  <aside class="history-panel">
   <button id="resumeMatchBtn" class="resume-btn">
  <span class="icon">📄</span>
  <span class="text">Match Resume with Job</span>
  <span class="arrow">➜</span>
</button>
    <h3>🕘 History</h3>
    <ul id="historyList"></ul>
  </aside>

</div>
<div id="aiBot">
  <span> <img src="https://img.icons8.com/pulsar-color/48/bot.png" /></span>
</div>
<div id="aiChatOverlay">
  <div id="aiChatPanel">
    <div class="chat-header">
      <span>AI Assistant</span>
      <span class="mini-close">✕</span>
    </div>

    <div class="chat-body">
      <div class="bot-msg">Hi 👋 I’m your AI assistant. I am specifically made for people with tech background. I can provide you links of study materials for topics you may ask. </div>
    </div>

    <div class="chat-input">
      <input type="text" placeholder="Ask anything..." />
      <button>➤</button>
    </div>
  </div>
</div>
<script>
  document.getElementById("resumeMatchBtn").onclick = () => {
    location.href = "resume-match.html";
  };
    
  const bot = document.getElementById("aiBot");
  const overlay = document.getElementById("aiChatOverlay");
  const chatPanel = document.getElementById("aiChatPanel");
  const closeBtn = document.querySelector(".mini-close");

  // Open chat
  bot.onclick = () => {
    overlay.classList.add("active");
  };

  // Close via small cross
  closeBtn.onclick = () => {
    overlay.classList.remove("active");
  };

  // Click outside closes chat
  overlay.onclick = () => {
    overlay.classList.remove("active");
  };

  // Prevent closing when clicking inside chat
  chatPanel.onclick = (e) => {
    e.stopPropagation();
  };



</script>
<script>
  // ================= CHAT AI CONNECTION =================
  const chatInput = document.querySelector(".chat-input input");
  const chatSendBtn = document.querySelector(".chat-input button");
  const chatBody = document.querySelector(".chat-body");

  chatSendBtn.onclick = sendMessage;
  chatInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  async function sendMessage() {
    const message = chatInput.value.trim();
    if (!message) return;

    // User message
    chatBody.innerHTML += `
      <div class="user-msg">${message}</div>
    `;
    chatInput.value = "";
    chatBody.scrollTop = chatBody.scrollHeight;

    // Thinking indicator
    const thinking = document.createElement("div");
    thinking.className = "bot-msg";
    thinking.textContent = "🤔 Searching study material...";
    chatBody.appendChild(thinking);
    chatBody.scrollTop = chatBody.scrollHeight;

    try {
      const res = await fetch("http://127.0.0.1:8000/ai-chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ text: message })
      });

      const data = await res.json();
      thinking.remove();

      let reply = `<div class="bot-msg"><b>📚 Study Material:</b><ul>`;

      data.resources.forEach(item => {
        reply += `
          <li>
            <a href="${item.link}" target="_blank">
              ${item.title}
            </a>
          </li>`;
      });

      reply += `</ul></div>`;

      chatBody.innerHTML += reply;
      chatBody.scrollTop = chatBody.scrollHeight;

    } catch (err) {
      thinking.textContent = "❌ Failed to fetch study material.";
      console.error(err);
    }
  }
</script>

<script src="https://unpkg.com/@mlc-ai/web-llm/dist/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script type="module" src="dashboard.js"></script>

</body>

</html>
